name: Lanterna G86 APK Build

on:
  push:
    branches:
      - lanterna-g86-apk-build
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Reassemble Lanterna G86 v1.2.0 source
        run: |
          rm -rf /tmp/lanterna-g86
          mkdir -p /tmp/lanterna-g86
          cat lanterna-g86-v120/part_* > /tmp/LanternaG86-source.zip.b64
          base64 --decode /tmp/LanternaG86-source.zip.b64 > /tmp/LanternaG86-source.zip
          unzip -q /tmp/LanternaG86-source.zip -d /tmp/lanterna-g86
          test -f /tmp/lanterna-g86/LanternaG86/app/build.gradle
          grep -q "versionName '1.2.0'" /tmp/lanterna-g86/LanternaG86/app/build.gradle
          sed -i '/app:checkable="true"/d' /tmp/lanterna-g86/LanternaG86/app/src/main/res/layout/activity_main.xml
          sed -i '/compileSdk 36/a\\    buildFeatures { buildConfig true }' /tmp/lanterna-g86/LanternaG86/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        working-directory: /tmp/lanterna-g86/LanternaG86
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f /tmp/lanterna-g86/LanternaG86/app/build/outputs/apk/debug/app-debug.apk
          ls -lh /tmp/lanterna-g86/LanternaG86/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanternaG86-v1.2.0-app-debug
          path: /tmp/lanterna-g86/LanternaG86/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
