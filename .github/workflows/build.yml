name: Build Halide WebAssembly

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Cache Halide and Emscripten
        uses: actions/cache@v4
        with:
          path: |
            .build
            .emsdk
          key: nebulastack-halide-21-emscripten-6.0.9-v1

      - name: Install Emscripten 6.0.9
        shell: bash
        run: |
          if [[ ! -d .emsdk/.git ]]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git .emsdk
          fi
          .emsdk/emsdk install 6.0.9
          .emsdk/emsdk activate 6.0.9

      - name: Build Halide SIMD module
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          source .emsdk/emsdk_env.sh
          bash build-wasm.sh 2>&1 | tee build.log

      - name: Inspect generated module
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          file dist/astro-halide.wasm
          ls -lh dist
          sha256sum --check dist/SHA256SUMS

      - name: Upload browser artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nebulastack-halide-wasm
          path: |
            dist/astro-halide.js
            dist/astro-halide.wasm
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest browser artifacts
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]' && steps.build.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/astro-halide.js dist/astro-halide.wasm dist/SHA256SUMS
          git commit -m "Update Halide WebAssembly artifacts [skip ci]"
          git push

      - name: Publish failed build diagnostic
        if: always() && github.event_name == 'push' && github.actor != 'github-actions[bot]' && steps.build.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p diagnostics
          cp build.log diagnostics/latest-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics/latest-build.log
          git commit -m "Record Halide build diagnostic [skip ci]"
          git push

      - name: Fail unsuccessful build
        if: steps.build.outcome == 'failure'
        shell: bash
        run: exit 1
